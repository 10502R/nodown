{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="nd-card text-center py-5">
  <p class="badge-source badge-source-fixture mb-3">오류 {{ code }}</p>
  <h1 class="h4 mb-2 mt-1">{{ title }}</h1>
  <p class="text-muted mb-4">{{ message }}</p>
  <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
    <a class="btn btn-primary" href="{{ url_for('index') }}">처음 화면으로</a>
    <a class="btn btn-outline-secondary" href="{{ url_for('result.demo_start') }}">대표 시나리오 다시 시작</a>
  </div>
</div>
{% endblock %}
